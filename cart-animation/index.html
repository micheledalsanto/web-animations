<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Currency Selector (Fixed Top Left) -->
    <div class="currency-selector">
        <button class="currency-btn active" data-currency="EUR" data-symbol="€" data-rate="1">EUR (€)</button>
        <button class="currency-btn" data-currency="USD" data-symbol="$" data-rate="1.09">USD ($)</button>
        <button class="currency-btn" data-currency="GBP" data-symbol="£" data-rate="0.86">GBP (£)</button>
        <button class="currency-btn" data-currency="JPY" data-symbol="¥" data-rate="161.50">JPY (¥)</button>
    </div>

    <!-- Cart Button (Fixed Top Right) -->
    <div class="cart-button">
        <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count">0</span>
        <span class="cart-price">€0.00</span>
    </div>

    <!-- Product Card -->
    <div class="container">
        <div class="product-card">
            <div class="product-image">
                <img src="blaz-erzetic-j9Vr54fl2dI-unsplash.jpg" alt="Premium Headphones">
            </div>
            <div class="product-info">
                <h3 class="product-title">Premium Headphones</h3>
                <p class="product-description">Wireless noise-cancelling headphones with premium sound quality</p>
                <div class="product-footer">
                    <span class="product-price">€149.99</span>
                    <button class="add-to-cart-btn" data-price="149.99" data-name="Premium Headphones">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
